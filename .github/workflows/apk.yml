
name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permissão ao Gradle
        run: chmod +x gradlew
        working-directory: "./HSHPDF-Android (1)/HSHPDF-Android"

      - name: Compilar APK
        run: ./gradlew assembleDebug
        working-directory: "./HSHPDF-Android (1)/HSHPDF-Android"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: HSHPDF-APK
          path: "HSHPDF-Android (1)/HSHPDF-Android/app/build/outputs/apk/debug/*.apk"
